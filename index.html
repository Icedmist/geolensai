<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeoLens AI</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>
<body>

    <div id="landing-page">
        <div class="hero-content">
            <div class="logo-badge">
                <div class="logo-circle">👁️</div>
            </div>
            <h1>GeoLens AI</h1>
            <p class="subtitle">Offline vision assistance powered by edge computing. See the world through sound and logic.</p>
            
            <button id="scanButton" class="launch-btn" aria-label="Launch core functionality">
                <span class="btn-text">Launch Core</span>
                <span class="btn-icon">→</span>
            </button>
        </div>

        <footer>
            <span>Built by <strong>Nasir Ibrahim Imam</strong></span><br>
            <nav class="social-links">
                <a href="https://github.com/icedmist" target="_blank" rel="noopener noreferrer" aria-label="GitHub">GitHub</a>
                <span class="separator">•</span>
                <a href="https://linkedin.com/in/nasir-ibrahim-imam-403ba523b" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">LinkedIn</a>
            </nav>
        </footer>
    </div>

    <div id="app-interface">
        
        <div class="top-bar">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">Ready</span>
            </div>
            <div class="performance-metrics">
                <span class="metric-item" id="fps-counter">FPS: 0</span>
                <span class="metric-separator">|</span>
                <span class="metric-item" id="inference-time">0ms</span>
            </div>
            <button id="audioToggle" class="icon-btn" aria-label="Audio controls" title="Toggle audio controls">
                <span class="icon-text">🔊</span>
            </button>
            <button id="screenToggle" class="icon-btn" aria-label="Toggle battery saver mode" title="Toggle battery saver mode">
                <span class="icon-text">⚡</span>
            </button>
        </div>

        <div id="loading-overlay" class="loading-overlay">
            <div class="loader-container">
                <div class="spinner"></div>
                <h3>Loading Model</h3>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="loader-status" id="loaderStatus">Initializing...</p>
            </div>
        </div>

        <div id="audio-controls" class="audio-controls hidden">
            <div class="controls-header">
                <h4>Audio Settings</h4>
                <button class="close-btn" id="closeAudioControls">✕</button>
            </div>
            <div class="control-group">
                <label for="speechRate">Speech Rate:</label>
                <div class="slider-container">
                    <input type="range" id="speechRate" min="0.5" max="2" step="0.1" value="1.1">
                    <span class="value-display" id="rateDisplay">1.1x</span>
                </div>
            </div>
            <div class="control-group">
                <label for="volume">Volume:</label>
                <div class="slider-container">
                    <input type="range" id="volume" min="0" max="100" step="5" value="100">
                    <span class="value-display" id="volumeDisplay">100%</span>
                </div>
            </div>
            <div class="control-group checkbox">
                <label for="muteToggle">
                    <input type="checkbox" id="muteToggle">
                    <span>Mute Audio</span>
                </label>
            </div>
        </div>

        <div id="cam-container">
            <video id="webcam" playsinline muted autoplay></video>
            <canvas id="canvas"></canvas>
            <div class="scan-line"></div>
        </div>

        <div id="hud-overlay">
            <div class="hud-header">
                <h3 id="sceneText" class="hud-title">SYSTEM READY</h3>
                <span class="hud-confidence" id="confidence">--</span>
            </div>
            <p id="objectList" class="hud-content">Initializing camera feed...</p>
            <div class="hud-footer">
                <span class="hud-hint">🔊 Audio active</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    
    <script>
        // Simple logic to hide landing page when app starts
        // (Your main script handles the camera, this just handles the fade out)
        document.getElementById('scanButton').addEventListener('click', () => {
            const landing = document.getElementById('landing-page');
            landing.style.opacity = '0';
            setTimeout(() => { landing.style.display = 'none'; }, 500);
        });
    </script>
</body>
</html>
